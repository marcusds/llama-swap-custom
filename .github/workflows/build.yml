name: build

# Builds llama-swap + llama.cpp from source and pushes to GHCR.
#
#   - Cron every day    -> rebuilds against the latest llama.cpp release.
#   - Manual run        -> lets you pin a specific llama.cpp ref / llama-swap version.
#   - Push to main      -> rebuilds when a Dockerfile or this workflow change.
#   - workflow_call     -> watch-llamacpp.yml calls us reactively when upstream
#                          lands a commit in a backend we ship (see image_filter).
#
# Every trigger builds the standard image fleet (unless image_filter narrows it):
#   - llama-swap-sycl           Intel SYCL on oneAPI 2025.3.3 (upstream's last SYCL-validated)
#   - llama-swap-sycl-2026      Intel SYCL on oneAPI 2026.1.2 (latest)
#   - llama-swap-sycl-bmg       oneAPI 2026.1.2, AOT-compiled for Battlemage
#                               (bmg_g21: Arc B580/B570, Arc Pro B50/B60). No
#                               SPIR-V JIT at llama-server start -- measured
#                               4s to ready vs 53s -- but runs ONLY on Battlemage.
#   - llama-swap-sycl-multigpu  Same as llama-swap-sycl but pinned to the older
#                               IGC 2.20.5 / NEO 25.40 stack. An escape hatch for
#                               multi-GPU hosts: NEO 26.27 *should* contain the
#                               multi-GPU fix (merged after 26.18 was cut), but
#                               that is inferred from release dates, so keep a
#                               known-good fallback until someone confirms on
#                               two dGPUs.
#
# All other images use IGC 2.38.2 / NEO 26.27.
#   - llama-swap-cuda13         NVIDIA CUDA 13.3 (amd64, all GPU architectures)
#   - llama-swap-cuda13-arm64   NVIDIA CUDA 13.3 (arm64, all GPU architectures)
#   - llama-swap-cuda13-blackwell-arm64  NVIDIA CUDA 13.3 (arm64, Blackwell SM 10.3 only — DGX Spark GB10)
#
# Each image in the fleet is built twice:
#   - upstream variant  (target: server)      bundles the mostlygeek/llama-swap release binary, tagged normally
#   - fork variant       (target: server-fork) builds llama-swap from our fork/branch, tagged with a "-fork" suffix
#
# A manual run with a custom image_name (e.g. llama-swap-sycl-next) bypasses the
# fleet and does a single one-off SYCL build (upstream variant only) using the
# oneapi_version input.

on:
  workflow_dispatch:
    inputs:
      llamacpp_ref:
        description: "llama.cpp git ref to build (tag like b9495, a commit sha, a branch, or 'latest' release)"
        default: "latest"
        required: false
      llama_swap_version:
        description: "llama-swap release to bundle for the upstream variant ('latest' or a version like 222)"
        default: "latest"
        required: false
      ls_repo:
        description: "llama-swap git repo to build from for the fork variant"
        default: "https://github.com/marcusds/llama-swap.git"
        required: false
      ls_ref:
        description: "llama-swap git ref to build for the fork variant (branch, tag, or sha)"
        default: "memory-budget"
        required: false
      sycl_f16:
        description: "Enable GGML_SYCL_F16 half-precision kernels"
        type: choice
        options: ["ON", "OFF"]
        default: "ON"
      oneapi_version:
        description: "oneAPI base image tag — ONLY used for a custom image_name one-off; the standard fleet pins its own per image"
        default: "2026.1.2-devel-ubuntu24.04"
        required: false
      image_name:
        description: "Set a non-default name (e.g. llama-swap-sycl-next) to do a single experimental build instead of the standard fleet"
        default: "llama-swap-sycl"
        required: false
      image_filter:
        description: "Which fleet images to build: 'all', or a comma-separated list of name substrings like 'sycl' / 'cuda' / 'sycl,cuda'"
        default: "all"
        required: false
  # Same inputs as above, for watch-llamacpp.yml to call us reactively.
  workflow_call:
    inputs:
      llamacpp_ref:
        type: string
        default: "latest"
        required: false
      llama_swap_version:
        type: string
        default: "latest"
        required: false
      ls_repo:
        type: string
        default: "https://github.com/marcusds/llama-swap.git"
        required: false
      ls_ref:
        type: string
        default: "memory-budget"
        required: false
      sycl_f16:
        type: string
        default: "ON"
        required: false
      oneapi_version:
        type: string
        default: "2026.1.2-devel-ubuntu24.04"
        required: false
      image_name:
        type: string
        default: "llama-swap-sycl"
        required: false
      image_filter:
        type: string
        default: "all"
        required: false
  schedule:
    # Every day at 06:00 UTC — track the latest llama.cpp release.
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.cuda"
      - ".github/workflows/build.yml"
      # config.example.yaml is deliberately NOT a trigger. It is only the
      # fallback config baked into the image, and real deployments bind-mount
      # their own over it -- rebuilding 12 images for a comment edit is not
      # worth it. The next scheduled or Dockerfile-driven build picks it up.

jobs:
  # Decide what to build: the standard fleet, or a single custom experimental
  # image when a non-default image_name is passed to a manual run.
  setup:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.set.outputs.builds }}
    steps:
      - name: Compute build matrix
        id: set
        run: |
          set -euo pipefail
          IMG="${{ inputs.image_name }}"
          ONEAPI="${{ inputs.oneapi_version }}"
          FILTER="${{ inputs.image_filter || 'all' }}"
          if [ -n "$IMG" ] && [ "$IMG" != "llama-swap-sycl" ]; then
            # One-off experimental SYCL build to a custom package (upstream variant only).
            builds=$(jq -cn \
              --arg img "$IMG" \
              --arg oa "${ONEAPI:-2026.1.2-devel-ubuntu24.04}" \
              '[{image:$img, variant:"upstream", target:"server", oneapi:$oa, cuda:"", cuda_archs:"", dockerfile:"Dockerfile", runner:"ubuntu-latest", platform:"linux/amd64", targetarch:"amd64"}]')
          else
            # Standard fleet.
            fleet='[
              {"image":"llama-swap-sycl",        "oneapi":"2025.3.3-0-devel-ubuntu24.04","cuda":"",     "cuda_archs":"",   "dockerfile":"Dockerfile",      "runner":"ubuntu-latest",    "platform":"linux/amd64","targetarch":"amd64"},
              {"image":"llama-swap-sycl-2026",    "oneapi":"2026.1.2-devel-ubuntu24.04",  "cuda":"",     "cuda_archs":"",   "dockerfile":"Dockerfile",      "runner":"ubuntu-latest",    "platform":"linux/amd64","targetarch":"amd64"},
              {"image":"llama-swap-sycl-bmg",     "oneapi":"2026.1.2-devel-ubuntu24.04",  "cuda":"",     "cuda_archs":"",   "dockerfile":"Dockerfile",      "runner":"ubuntu-latest",    "platform":"linux/amd64","targetarch":"amd64","sycl_arch":"bmg_g21"},
              {"image":"llama-swap-sycl-multigpu","oneapi":"2025.3.3-0-devel-ubuntu24.04","cuda":"",     "cuda_archs":"",   "dockerfile":"Dockerfile",      "runner":"ubuntu-latest",    "platform":"linux/amd64","targetarch":"amd64","neo":"legacy"},
              {"image":"llama-swap-cuda13",       "oneapi":"",                             "cuda":"13.3.0","cuda_archs":"",  "dockerfile":"Dockerfile.cuda","runner":"ubuntu-latest",    "platform":"linux/amd64","targetarch":"amd64"},
              {"image":"llama-swap-cuda13-arm64", "oneapi":"",                             "cuda":"13.3.0","cuda_archs":"",  "dockerfile":"Dockerfile.cuda","runner":"ubuntu-24.04-arm","platform":"linux/arm64","targetarch":"arm64"},
              {"image":"llama-swap-cuda13-blackwell-arm64","oneapi":"","cuda":"13.3.0","cuda_archs":"103","dockerfile":"Dockerfile.cuda","runner":"ubuntu-24.04-arm","platform":"linux/arm64","targetarch":"arm64"}
            ]'
            # image_filter narrows the fleet to the images whose name contains one
            # of the given substrings, so a reactive "sycl" trigger builds the four
            # SYCL images without dragging the three CUDA ones along with it.
            if [ -n "$FILTER" ] && [ "$FILTER" != "all" ]; then
              fleet=$(echo "$fleet" | jq -c --arg f "$FILTER" \
                '($f | split(",") | map(ascii_downcase | gsub("^\\s+|\\s+$";""))) as $pats
                 | map(select(.image as $i | $pats | any(. as $p | $i | contains($p))))')
            fi
            # Each fleet entry becomes two builds: upstream release + our fork/branch.
            builds=$(echo "$fleet" | jq -c '[.[] | . as $b | [
              ($b + {variant:"upstream", target:"server"}),
              ($b + {variant:"fork", target:"server-fork"})
            ]] | flatten')
          fi
          if [ "$(echo "$builds" | jq 'length')" -eq 0 ]; then
            echo "image_filter '$FILTER' matched no fleet images" >&2
            exit 1
          fi
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "### Build fleet: $builds" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: setup
    runs-on: ${{ matrix.build.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # Don't let one oneAPI version's failure cancel the other's build.
      fail-fast: false
      # Cap in-flight builds. Ten jobs finishing together all push multi-GB
      # mode=max layers into the 10 GB Actions cache quota, and an entry that
      # gets evicted mid-upload fails its export with "not_found".
      max-parallel: 3
      matrix:
        build: ${{ fromJSON(needs.setup.outputs.builds) }}
    # One in-flight build per (branch, image, variant) — upstream/fork build independently.
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.build.image }}-${{ matrix.build.variant }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The oneAPI base image + a full SYCL compile need more than the
      # default runner disk; reclaim ~25-30 GB before building.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false
          docker-images: false

      - name: Resolve versions
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF="${{ inputs.llamacpp_ref || 'latest' }}"
          if [ "$REF" = "latest" ] || [ -z "$REF" ]; then
            REF=$(gh api repos/ggml-org/llama.cpp/releases/latest --jq .tag_name)
          fi
          LS_VER="${{ inputs.llama_swap_version || 'latest' }}"
          if [ "$LS_VER" = "latest" ] || [ -z "$LS_VER" ]; then
            LS_VER=$(gh api repos/mostlygeek/llama-swap/releases/latest --jq .tag_name)
          fi
          LS_VER="${LS_VER#v}"
          LS_REPO="${{ inputs.ls_repo || 'https://github.com/marcusds/llama-swap.git' }}"
          LS_REF="${{ inputs.ls_ref || 'memory-budget' }}"
          ONEAPI="${{ matrix.build.oneapi }}"
          CUDA="${{ matrix.build.cuda }}"
          IMG="${{ matrix.build.image }}"
          VARIANT="${{ matrix.build.variant }}"
          if [ -n "$CUDA" ]; then
            BASE="CUDA $CUDA"
          else
            BASE="oneAPI $ONEAPI"
          fi
          if [ "$VARIANT" = "fork" ]; then
            TAG_SUFFIX="-fork"
            LS_TAG=$(echo "$LS_REF" | tr -c 'a-zA-Z0-9._-' '-')
            SRC_DESC="llama-swap \`$LS_REPO@$LS_REF\`"
          else
            TAG_SUFFIX=""
            LS_TAG="$LS_VER"
            SRC_DESC="llama-swap \`v$LS_VER\`"
          fi
          # Intel GPU userspace stack. Current stack by default; a fleet entry
          # sets neo:"legacy" to fall back to the older validated set, which is
          # what multi-GPU hosts need (llama.cpp#21747, compute-runtime#921).
          if [ "${{ matrix.build.neo }}" = "legacy" ]; then
            {
              echo "igc=v2.20.5"
              echo "igc_full=2_2.20.5+19972"
              echo "neo=25.40.35563.10"
              echo "neo_full=25.40.35563.10-0"
              echo "igdgmm=22.8.2"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "igc=v2.38.2"
              echo "igc_full=2_2.38.2+22051"
              echo "neo=26.27.39122.11"
              echo "neo_full=26.27.39122.11-0"
              echo "igdgmm=22.10.0"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "llamacpp_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "ls_ver=$LS_VER"    >> "$GITHUB_OUTPUT"
          echo "ls_tag=$LS_TAG"    >> "$GITHUB_OUTPUT"
          echo "ls_repo=$LS_REPO"  >> "$GITHUB_OUTPUT"
          echo "ls_ref=$LS_REF"    >> "$GITHUB_OUTPUT"
          echo "tag_suffix=$TAG_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "oneapi=$ONEAPI"    >> "$GITHUB_OUTPUT"
          echo "cuda=$CUDA"        >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/$IMG" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "### Building \`$IMG\` ($VARIANT) — llama.cpp \`$REF\` + $SRC_DESC on $BASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.build.dockerfile }}
          target: ${{ matrix.build.target }}
          platforms: ${{ matrix.build.platform }}
          push: true
          provenance: false
          tags: |
            ${{ steps.ver.outputs.image }}:latest${{ steps.ver.outputs.tag_suffix }}
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.llamacpp_ref }}${{ steps.ver.outputs.tag_suffix }}
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.llamacpp_ref }}-ls${{ steps.ver.outputs.ls_tag }}${{ steps.ver.outputs.tag_suffix }}
          build-args: |
            LLAMACPP_REF=${{ steps.ver.outputs.llamacpp_ref }}
            LS_VER=${{ steps.ver.outputs.ls_ver }}
            LS_REPO=${{ steps.ver.outputs.ls_repo }}
            LS_REF=${{ steps.ver.outputs.ls_ref }}
            GGML_SYCL_F16=${{ inputs.sycl_f16 || 'ON' }}
            GGML_SYCL_DEVICE_ARCH=${{ matrix.build.sycl_arch }}
            IGC_VERSION=${{ steps.ver.outputs.igc }}
            IGC_VERSION_FULL=${{ steps.ver.outputs.igc_full }}
            COMPUTE_RUNTIME_VERSION=${{ steps.ver.outputs.neo }}
            COMPUTE_RUNTIME_VERSION_FULL=${{ steps.ver.outputs.neo_full }}
            IGDGMM_VERSION=${{ steps.ver.outputs.igdgmm }}
            ONEAPI_VERSION=${{ steps.ver.outputs.oneapi }}
            CUDA_VERSION=${{ steps.ver.outputs.cuda }}
            CUDA_ARCHITECTURES=${{ matrix.build.cuda_archs }}
            TARGETARCH=${{ matrix.build.targetarch }}
            BUILD_DATE=${{ steps.ver.outputs.build_date }}
          # Scope the GHA cache per (image, variant) so builds don't evict
          # each other's layers.
          cache-from: type=gha,scope=${{ matrix.build.image }}-${{ matrix.build.variant }}
          # ignore-error: a cache export evicted by the 10 GB quota must not
          # fail a build whose image already pushed successfully.
          cache-to: type=gha,scope=${{ matrix.build.image }}-${{ matrix.build.variant }},mode=max,ignore-error=true
